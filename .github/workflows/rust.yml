name: CI

on:
  # Only main on push. Every other branch is covered by pull_request, and
  # listing "*" here meant a push to a branch with an open PR ran the whole
  # suite twice — once for each event.
  push:
    branches: [ main ]
    paths-ignore: &non_code
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore: *non_code

# A newer commit makes an in-flight run obsolete. Without this, two pushes a
# minute apart both ran to completion — three full Rust compiles each.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: debug

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Rust target
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Build
        env:
          RUSTFLAGS: '--cfg tokio_unstable -C target-feature=+crt-static'
        run: cargo build --release --target x86_64-unknown-linux-gnu --features console --verbose

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        env:
          RUST_TEST_THREADS: 5
        run: cargo nextest run --status-level all

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # tarpaulin instruments and rebuilds the whole tree, so this doubles the
    # cost of every run. Coverage is informational and only ever read for the
    # mainline, so pay for it there rather than on every branch and PR.
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Generate code coverage
        run: |
          cargo tarpaulin --verbose --all-features --timeout 120 --out xml --exclude-files "*/bin/*" --exclude-files "*/examples/*" --exclude-files "*/tests/*" --exclude-files "*/benches/*"

      - name: Upload to codecov.io
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Coverage upload is informational. Don't fail the build if
          # codecov is rate-limiting or temporarily unavailable.
          fail_ci_if_error: false
        continue-on-error: true
