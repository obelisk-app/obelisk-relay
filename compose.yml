services:
  groups_relay:
    profiles: ["retired"]
    # Prebuilt image published from the workstation; see BUILD_ON_SERVER.md.
    # `docker compose pull groups_relay` fetches it (~30s) instead of compiling
    # from source. Override RELAY_IMAGE_TAG to pin a version (for example
    # sha-5c154eb). Devs editing the relay can still build locally with:
    #   docker compose build groups_relay
    image: ghcr.io/obelisk-app/obelisk-relay:${RELAY_IMAGE_TAG:-v2026.09.18-compaction-update-arm64}
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./config:/app/config
      - relay-db:/app/db
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      NIP29__relay__relay_url: "${RELAY_URL:-wss://relay.obelisk.ar}"
      TOKIO_BLOCKING_THREADS: "2048"
      # Docker tells a process nothing about the image it came from, so the
      # admin console cannot report which version is running unless the tag is
      # passed in. Same default as the image line above.
      RELAY_IMAGE_TAG: "${RELAY_IMAGE_TAG:-v2026.09.18-compaction-update-arm64}"
    ports:
      - "${RELAY_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "--max-time", "5", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Public, unrestricted instance of the same relay binary, exposed via Cloudflare
  # tunnel as wss://public.obelisk.ar. Empty whitelist + per-pubkey rate limits.
  # Automatic event retention pruning is disabled unless explicitly enabled in
  # public-config/settings.local.yml.
  public_relay:
    image: ghcr.io/obelisk-app/obelisk-relay:${RELAY_IMAGE_TAG:-v2026.09.19-reports-2-arm64}
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./public-config:/app/config
      - public-relay-db:/app/db
      - ./public-config/branding/favicon.ico:/app/frontend/dist/favicon.ico:ro
      # Purple theme override. The filename hash must match the stylesheet
      # index.html actually loads, or this mounts a file nothing reads and the
      # site silently reverts to the default green -- which is what happened to
      # the two previous overrides.
      #
      # Never hand-edit or hand-rename this. After any frontend change:
      #   docker compose build public_relay
      #   scripts/retint-branding.sh ghcr.io/obelisk-app/obelisk-relay:<tag>
      # then update both sides of the line below to the hash it prints.
      #
      # A UI-driven update does this for you: scripts/relay-updater.sh runs
      # retint.sh against the new image and rewrites this line before recreating
      # the container, and fails the update rather than shipping a green theme.
      - ./public-config/branding/assets/index-CHE27k9K.css:/app/frontend/dist/assets/index-CHE27k9K.css:ro
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      NIP29__relay__relay_url: "wss://public.obelisk.ar"
      TOKIO_BLOCKING_THREADS: "2048"
      # See the note on the same line in groups_relay: the console reports the
      # running version from this, because the container cannot discover it.
      RELAY_IMAGE_TAG: "${RELAY_IMAGE_TAG:-v2026.09.19-reports-2-arm64}"
    ports:
      - "127.0.0.1:8081:8080"
    # The relay process still runs as uid 0 inside the container, because the
    # config directory is a bind mount that the *host* update agent also writes
    # to as root: switching the container to a non-root uid gives you two writers
    # with different owners over one directory, and the failure mode is the admin
    # console silently unable to persist a setting.
    #
    # So constrain what uid 0 can actually do instead. The relay needs no
    # capabilities at all -- it binds 8080, which is unprivileged, and never
    # changes ownership, mounts anything, or signals another process.
    # no-new-privileges additionally stops any setuid binary in the image from
    # being a way back up.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-sf", "--max-time", "5", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Follow-graph indexer backing `relay.wot` admission. Answers
  # GET /distance?from=&to=&max_hops= in about a millisecond once its graph is
  # warm; the relay asks it once per authenticated connection and caches the
  # verdict. Only reachable on the compose network — no published port, because
  # nothing outside needs it and the oracle has no auth of its own.
  #
  # Source: https://github.com/nostr-wot/nostr-wot-oracle. There is no published
  # image, so this builds from a checkout. Clone it next to this repo:
  #   git clone https://github.com/nostr-wot/nostr-wot-oracle ../nostr-wot-oracle
  # and start it with:  docker compose --profile wot up -d --build wot-oracle
  wot-oracle:
    profiles: ["wot"]
    build:
      context: ../nostr-wot-oracle
      dockerfile: Dockerfile
    volumes:
      - wot-oracle-data:/app/data
    environment:
      # Relays to sync kind-3 contact lists from. The graph is only as complete
      # as these: a root whose follow list lives nowhere here looks like it
      # follows nobody, and the relay then admits nobody through the WoT tier.
      RELAYS: "${WOT_RELAYS:-wss://relay.damus.io,wss://nos.lol,wss://relay.primal.net/,wss://purplepag.es}"
      HTTP_PORT: "8080"
      DB_PATH: "/app/data/wot.db"
      # Default is 100/min per IP. Every relay connection is one source IP here
      # (the relay container), so the default would throttle the relay itself
      # during a connection burst — and a throttled query reads as a failure.
      RATE_LIMIT_PER_MINUTE: "${WOT_RATE_LIMIT_PER_MINUTE:-6000}"
      # Must be >= relay.wot.max_hops, or the oracle rejects the query outright.
      MAX_HOPS: "${WOT_MAX_HOPS:-3}"
      RUST_LOG: "${RUST_LOG:-info}"
    healthcheck:
      test: ["CMD", "curl", "-sf", "--max-time", "5", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The first sync has to walk a lot of kind-3 events before /health is
      # meaningful.
      start_period: 180s
    restart: unless-stopped

volumes:
  relay-db:
  public-relay-db:
  wot-oracle-data:
