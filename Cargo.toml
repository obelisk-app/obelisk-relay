[package]
name = "groups_relay"
version = "0.1.0"
edition = "2021"
authors = ["Daniel Cadenas <dcadenas@gmail.com>"]
license = "AGPL-3.0-only"
repository = "https://github.com/obelisk-app/obelisk-relay"
default-run = "groups_relay"

[dependencies]
# Upstream. This fork's protocol layer and storage engine are verse-pbc code,
# not optional extras: relay_builder is the relay framework, and the nostr-*
# crates below are their fork of rust-nostr, including the LMDB store the
# events live in.
#
# DO NOT add `rev = "..."` to these. It looks like the right thing and it breaks
# the build. relay_builder declares the same nostr crates *unpinned*, so pinning
# on this side creates a second source identity for the identical commit --
# `git+...?rev=X#X` alongside `git+...#X` -- and cargo then compiles two copies
# of nostr 0.44.1 that do not unify. The symptom is a wall of "expected
# ClientMessage<'static>, found nostr_sdk::ClientMessage<'_>". Tried, reverted.
#
# The pin that does work is Cargo.lock, which is committed and names the exact
# commits. Treat a change to those lines in a diff as a dependency bump and
# review it as one; `cargo update` is what would move them silently.
relay_builder = { git = "https://github.com/verse-pbc/relay_builder" }
tokio = { version = "1.45", features = ["full"] }
anyhow = { version = "1.0.89", features = ["backtrace"] }
async-trait = "0.1.82"
tracing = { version = "0.1" }
serde = { version = "1.0", features = ["derive"] }
futures = "0.3.31"
clap = { version = "4.5.17", features = ["derive"] }
nostr-sdk = { git = "https://github.com/verse-pbc/nostr", features = ["all-nips"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
tracing-appender = "0.2"
metrics = "0.24.1"
metrics-exporter-prometheus = "0.16.2"
rand = "0.8.5"
thiserror = "2.0.12"
indicatif = "0.17"

tokio-util = { version = "0.7.1", features = ["rt"] }
tokio_util_watchdog = { version = "0.2", default-features = false }
dashmap = "6.1.0"
config = "0.15.11"
axum = { version = "0.8.4", features = ["ws", "http1"] }
axum-server = "0.8.0"
strum = { version = "0.27.1", features = ["derive", "strum_macros"] }
snafu = { version = "0.8.5", features = ["backtrace"] }
console-subscriber = { version = "0.4.1", optional = true }
console-api = { version = "0.9", optional = true }
tonic = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }
tokio-stream = { version = "0.1", optional = true }
serde_json = "1.0"
chrono = { version = "0.4", optional = true }
tower-http = { version = "0.6.2", features = ["trace", "cors", "fs", "timeout"] }
tower = { version = "0.4.13", features = ["util"] }
nostr = { git = "https://github.com/verse-pbc/nostr", features = ["std"] }
nostr-database = { git = "https://github.com/verse-pbc/nostr" }
nostr-lmdb = { git = "https://github.com/verse-pbc/nostr" }
time = { version = "0.3.37", features = ["local-offset", "macros"] }
humantime-serde = "1.1.1"
tracing-futures = "0.2.5"
once_cell = "1.20"
rustls = { version = "0.23", features = ["aws_lc_rs"] }
parking_lot = "0.12"
heavykeeper = "0.6"
governor = "0.10.1"
nonzero_ext = "0.3"
# WoT oracle queries (src/wot.rs). rustls rather than native-tls so the image
# keeps the single TLS stack it already links for outbound relay connections.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# LMDB, opened directly for compaction (src/compaction.rs). nostr-lmdb keeps its
# Env private and exposes no copy/compact API, so reclaiming free-list slack means
# opening the environment ourselves. Version and features match what nostr-lmdb
# and relay_builder already depend on, so this unifies rather than linking a
# second copy of lmdb-master-sys.
heed = { version = "0.20", default-features = false, features = ["read-txn-no-tls"] }
# The same LMDB heed links, reached directly to walk the free list. heed's own
# `non_free_pages_size` cannot be used here: it assumes every key in the unnamed
# database is a sub-database name, and nostr-lmdb stores the default scope's
# events there, so it panics decoding a 32-byte event id as UTF-8. `default = []`
# for this crate, so depending on it adds no features to what heed asked for.
lmdb-master-sys = "0.2"
# statvfs, for the free-disk precheck before a compaction copy.
libc = "0.2"

[features]
console = ["dep:console-subscriber"]
console-dump = ["dep:console-api", "dep:tonic", "dep:prost"]

[dev-dependencies]
criterion = { version = "0.6.0", features = ["async_tokio"] }
futures-util = "0.3.31"
flume = "0.11"
pretty_assertions = "1.4.1"
tempfile = "3.14.0"
tokio-tungstenite = "0.26.1"

[[bench]]
name = "event_verify"
harness = false

[[bench]]
name = "event_sign"
harness = false

[[bench]]
name = "middleware_comparison"
harness = false

[[bin]]
name = "add_original_relay"
path = "src/bin/add_original_relay.rs"

[[bin]]
name = "console_dump"
path = "src/bin/console_dump.rs"
required-features = ["console-dump"]

[[bin]]
name = "deadlock_torture"
path = "src/bin/deadlock_torture.rs"

