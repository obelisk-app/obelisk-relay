# Default relay configuration
relay:
  # Relay identity.
  # No key here on purpose. This file is committed, so any key in it is
  # public. The relay generates a unique identity on first start and writes it
  # to settings.local.yml (which is gitignored). See docs/export-import.md for
  # what the relay identity controls.
  relay_secret_key: ""
  local_addr: "0.0.0.0:8080"
  relay_url: "ws://example.local:8080"
  db_path: "/app/db"
  
  # Subscription limits
  # Maximum number of subscriptions per connection
  max_subscriptions: 50
  # Default/maximum limit for database queries (REQ filters)
  max_limit: 500

  # NIP-50 indexed search support for REQ/COUNT filters with `search`.
  # Set enable_indexed_search: false to reject search filters and stop
  # advertising NIP-50. Override advertise_indexed_search only if the relay
  # should accept search filters without advertising NIP-50.
  enable_indexed_search: true
  # advertise_indexed_search: true

  # Obelisk optimized HTTP bootstrap and pagination. These limits are separate
  # from normal Nostr WebSocket REQ/subscription limits.
  obelisk_index:
    enabled: true
    recent_per_group: 50
    max_bootstrap_groups: 500
    max_page_limit: 100
    bootstrap_requests_per_minute: 30
    message_requests_per_minute: 120
    reconcile_interval: "5m"

  # WebSocket settings
  websocket:
    # Maximum time a connection can stay open (optional)
    # Uses humantime format (e.g., "1h", "30m", "24h")
    max_connection_duration: "5m"
    # Idle timeout - disconnects after period of inactivity
    # Usually set to same value as max_connection_duration
    idle_timeout: "5m"
    # Maximum number of concurrent connections (optional)
    max_connections: 300
